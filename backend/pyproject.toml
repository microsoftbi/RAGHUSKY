[project]
name = "ragusky-backend"
version = "0.1.0"
description = "RAGUSKY backend: FastAPI + LangChain + Chroma + SQLite"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "argon2-cffi>=23.1",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "langchain==1.1.*",
    "langchain-core==1.1.*",
    "langchain-community==0.3.*",
    "langchain-chroma>=0.1.4",
    "langchain-ollama>=0.2",
    "langchain-openai>=0.2",
    "chromadb>=0.5",
    "pypdf>=5.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "langchain-text-splitters>=1.0.0",
    "python-docx>=1.2.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
